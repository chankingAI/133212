version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: fullstack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: fullstack-website
    volumes:
      - mongodb_data:/data/db
    networks:
      - fullstack-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fullstack-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/fullstack-website?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - mongodb
    networks:
      - fullstack-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fullstack-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - fullstack-network

volumes:
  mongodb_data:

networks:
  fullstack-network:
    driver: bridge